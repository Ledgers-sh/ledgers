# SKR03 account numbers -> de-hgb account numbers (issue #5).
#
# Numbers only, on purpose: SKR account *names* are their publisher's
# intellectual property ("Nachdruck ... nicht gestattet"), so neither the
# names nor any other Datev text is bundled here — the bare account number
# is the industry-standard interface every German bookkeeping system
# exports. See NOTICE and templates/LICENSES.md.
#
# Every source number below was verified against at least two public
# listings of the DATEV Standardkontenrahmen SKR 03 (sources recorded in
# issue #5); rows were omitted rather than guessed wherever no clean
# de-hgb counterpart exists. This is a migration seed, not an exhaustive
# translation — unmapped accounts stay on their importer's review list.

id = "de-skr03-to-de-hgb"
source = "de-skr03"
target = "de-hgb"
version = 1

