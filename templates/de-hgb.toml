# The German chart of accounts, structured on HGB §266 (balance sheet) and
# §275 (income statement). Original Ledgers chart — every number, name key
# and grouping is ours; the statute itself is public law.
#
# `ebilanz` values are position identifiers of the E-Bilanz-Taxonomie 6.9
# (BMF letter of 2025-06-10, published with EStH Anhang 7; taxonomy
# © XBRL Deutschland e.V.). Identifiers only — no taxonomy text is
# reproduced. See NOTICE and templates/LICENSES.md for the licence basis.
#
# Positions are tagged only where a taxonomy counterpart was verified.
# Left untagged on purpose: the balance sheet in the taxonomy is presented
# NET of accumulated depreciation (no contra position exists), and no
# verified position was found for input VAT (asset side), interest income,
# FX gains/losses or rounding — so accounts 10900, 11500, 22500, 31100,
# 31200, 41100, 42200 carry no `ebilanz`.
#
# Many accounts intentionally share one eBilanz position: fiscal-statement
# lines aggregate account balances (e.g. all four Umsatzerlöse accounts
# roll up into ...totalOutput.netSales).

id = "de-hgb"
name = "template.de_hgb.name"
version = 1

