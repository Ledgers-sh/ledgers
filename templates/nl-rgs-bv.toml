# Dutch chart of accounts for Besloten vennootschap (BV, private company), built on the Referentie
# Grootboekschema (RGS) version 3.7, MKB tab.
#
# Sources (checked 2026-10-23):
#   RGS 3.7 definitive version (Excel, Taakgroep RGS, released 2025-03-03):
#     https://www.referentiegrootboekschema.nl/definitieve-versie-rgs-37
#   The RGS referentienummers (the 'rgs-' tags below) are identifiers, not text.
#   Account names are ours, written in Dutch and translated in templates/i18n/.
#   RGS 3.7 MKB labels used for the BTW boxes: rubriek 1a-1e, 2a, 3b, 4a, 4b, 5b, 5d
#   (quoted in the RGS names of codes 8001060, 1205010, 9101000 and others).
#
# Each postable account carries one 'rgs-<referentienummer>' tag. Several accounts
# may share one code where RGS has no separate line (for example the rounding
# account and the overhead account both sit on 4215010, and both fx lines on
# 8407010); the tag then records the RGS line the account reports under.
#
# TODO: the RGS line for accumulated depreciation (negative asset) is not modelled;
#   the asset accounts carry net book value only.
# TODO: the company type (eenmanszaak or BV) is chosen in Settings; the VOF chart is
#   not built.
# TODO: the RGS code for income tax of the owner (inkomstenbelasting) is private and
#   is not in the company chart.


