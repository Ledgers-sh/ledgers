[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ledgers-sh/ledgers"

[workspace.dependencies]
# One Cratefield release round, pinned exactly, bumped together in one PR (docs/adr/0001).
cratefield-core = "=0.10.1"
cratefield-runtime-cloudflare = "=0.5.0"
cratefield-runtime-native = "=0.4.4"
cratefield-adapter-sqlite = "=0.3.2"
# The workspace default for the testing kit is its light, wasm-clean surface
# (port conformance only, no harness graph); a crate that wants the harness
# (TestHarness, fakes) adds `features = ["harness"]`, which is the kit's
# default feature set.
cratefield-testing = { version = "=0.5.4", default-features = false, features = [
    "port-conformance",
] }
# The `fz` CLI (doctor, migration collection); 0.7.0 is the release of the
# same round (requires core ^0.9). Not depended on by a crate yet — pinned
# here so the tooling tasks inherit the round instead of re-resolving it.
cratefield-cli = "=0.7.2"
# The query builder cratefield-core renders statements with; the exact
# version core 0.9.0 pins, with the same features (SQLite dialect,
# thread-safe), so the workspace graph holds one sea-query.
sea-query = { version = "=0.32.7", default-features = false, features = [
    "backend-sqlite",
    "thread-safe",
] }

# Exact money (issue #3):
thiserror = "2"
proptest = "1"

# Async traits (wasm-clean with ?Send):
async-trait = "0.1"

# Bytes: used by streaming routes
bytes = "1"

# Futures: used by streaming routes
futures-core = "0.3"
futures-util = "0.3"

# Tracing: subscriber for instrumentation (used in tests for log capture):
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# JSON schema generation — matches cratefield-core 0.10.1's 1.2.3 (no duplicate versions):
schemars = "1.2"

# Storage foundation (issue #4): block-on for the conformance matrix tests,
# the same release the testing kit itself uses.
pollster = "0.4"

# Chart of accounts and country templates (issue #5): the workspace's own
# money crate for currency validation, plus TOML parsing for the bundled
# chart/mapping/i18n data files under templates/.
ledgers-money = { path = "crates/ledgers-money" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Guard-statement helpers on the Database port (issue #40): every writing
# crate shares the same numbering, period, limit and chain patterns.
ledgers-db = { path = "crates/ledgers-db" }
# Hash-chained audit log, canonical JSON and the offline verifier
# (issue #9).
ledgers-audit = { path = "crates/ledgers-audit" }
# Command registry and executor with policy and audit logging (issue #10).
ledgers-commands = { path = "crates/ledgers-commands" }
# Agent key policy, tiers, limits, and decision-making (issue #11).
ledgers-policy = { path = "crates/ledgers-policy" }
# Authentication, identity, and session management (issue #12).
ledgers-auth = { path = "crates/ledgers-auth" }
# Approval requests with journal preview and passkey step-up (issue #13).
ledgers-approvals = { path = "crates/ledgers-approvals" }
# Extension traits with open defaults (issue #14).
ledgers-ext = { path = "crates/ledgers-ext" }
# Chart of accounts, journals, entries, periods, closures (issues #5, #6, #7).
ledgers-ledger = { path = "crates/ledgers-ledger" }
# Storage foundation (issue #4).
ledgers-storage = { path = "crates/ledgers-storage" }
# Exchange rates (issue #5 FX subsection).
ledgers-fx = { path = "crates/ledgers-fx" }
# Tax codes and calculations (issue #5 tax subsection).
ledgers-tax = { path = "crates/ledgers-tax" }
# Exact match to the time release cratefield-core pins (its Usage
# statements take OffsetDateTime): one `time` in the workspace graph.
time = "=0.3.55"

# SHA-256: ledgers-audit (#9) owns audit hashing and verification with
# this; ledgers-ledger's interim period hashes still stamp with it.
sha2 = "0.10"

# Secure zero-copy types for PIN handling (issue #57):
zeroize = { version = "1", features = ["derive"] }

# Hex encoding for external_id (issue #57):
hex = "0.4"

# FinTS 3.0 PIN/TAN bank feed (issue #57, ledgers-fints crate):
fints-rs = "=0.2.0"

# Dev dependencies for ledgers-commands (issue #10):
insta = { version = "1", features = ["json"] }
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

# Money and ledger crates additionally deny `clippy::float_arithmetic` via a
# `#![deny(clippy::float_arithmetic)]` crate attribute: workspace lints cannot
# vary per crate, so the stricter money rule lives in the crates that need it.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Unpublished harness crates (cratefield-auth-passkeys, cratefield-mcp) are NOT
# on crates.io yet; they will arrive later via one pinned git rev plus a
# [patch.crates-io] section per docs/adr/0001. Do not add a [patch] section
# until that rev exists.
