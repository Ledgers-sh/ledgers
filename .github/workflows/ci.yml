# CI for the Ledgers core.
#
# The toolchain versions below must stay in sync with rust-toolchain.toml:
# the dtolnay action's `toolchain` input decides what CI runs, so a mismatch
# would silently test something other than the repo's pinned toolchain. Bump
# both in the same PR.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --target wasm32-unknown-unknown -p ledgers-server

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - name: Open-core boundary (docs/adr/0002)
        run: bash tools/check-boundary.sh
      - name: Harness pins - exactly one cratefield-core (docs/adr/0001)
        run: bash tools/check-harness-pins.sh
      - name: Harness git revs are on harness main (docs/adr/0001)
        run: bash tools/check-harness-rev.sh
