# CI for the Ledgers core.
#
# The toolchain versions below must stay in sync with rust-toolchain.toml:
# the dtolnay action's `toolchain` input decides what CI runs, so a mismatch
# would silently test something other than the repo's pinned toolchain. Bump
# both in the same PR.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  # The Postgres parity leg of the storage, ledger, guard, audit and
  # approvals matrices (issues #4 and #66): the crates' `postgres`
  # feature plus FZ_TEST_POSTGRES_URL make `TestHarness::all_dialects`
  # add a throwaway database on this service per harness. Without this
  # job the leg is silently skipped.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgers
          POSTGRES_PASSWORD: ledgers
          POSTGRES_DB: ledgers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FZ_TEST_POSTGRES_URL: postgres://ledgers:ledgers@localhost:5432/ledgers
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test --locked
          -p ledgers-storage -p ledgers-ledger -p ledgers-db -p ledgers-audit -p ledgers-approvals
          --features ledgers-storage/postgres,ledgers-ledger/postgres,ledgers-db/postgres,ledgers-audit/postgres,ledgers-approvals/postgres

  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --target wasm32-unknown-unknown -p ledgers-server

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - name: Open-core boundary (docs/adr/0002)
        run: bash tools/check-boundary.sh
      - name: Harness pins - exactly one cratefield-core (docs/adr/0001)
        run: bash tools/check-harness-pins.sh
      - name: Harness git revs are on harness main (docs/adr/0001)
        run: bash tools/check-harness-rev.sh
