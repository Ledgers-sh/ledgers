    rect { transform-box: fill-box; animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-.35px) } }
    @media (prefers-reduced-motion: reduce) { rect { animation: none } }
  </style>
