<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Owlpost"><style>*{animation-play-state:paused!important;animation-delay:-1.35s!important}</style>
  <title>Owlpost</title>
  <desc>The owl that never sleeps: a square face with two eyes and a beak. The pupils glance left and right, the eyes blink, and a letter drops in over its head.</desc>
  <style>
    /* One 6s cycle: glance left, glance right, blink, a letter lands. */
    .pupil { animation: glance 6s ease-in-out infinite; }
    .eye   { transform-box: fill-box; transform-origin: center; animation: blink 6s ease-in-out infinite; }
    .mail  { animation: drop 6s cubic-bezier(.5,0,.75,0) infinite; opacity: 0; }
    @keyframes glance { 0%,20% { transform: translate(0,0) } 26%,40% { transform: translate(-4px,1px) } 46%,60% { transform: translate(4px,2px) } 66%,100% { transform: translate(0,0) } }
    @keyframes blink  { 0%,70%,76%,100% { transform: scaleY(1) } 73% { transform: scaleY(.08) } }
    @keyframes drop   { 0%,78% { transform: translate(-26px,-26px); opacity: 0 } 82% { opacity: 1 } 94% { transform: translate(0,0); opacity: 1 } 100% { transform: translate(0,4px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .pupil, .eye, .mail { animation: none } .mail { display: none } }
  </style>
  <rect x="10" y="10" width="100" height="100" rx="30" fill="#0E1526"/>
  <g class="eye"><circle cx="41" cy="51" r="15" fill="#FFFFFF"/><circle class="pupil" cx="41" cy="51" r="7" fill="#F4B63F"/></g>
  <g class="eye"><circle cx="79" cy="51" r="15" fill="#FFFFFF"/><circle class="pupil" cx="79" cy="51" r="7" fill="#F4B63F"/></g>
  <path d="M52 73H68L60 84Z" fill="#F4B63F"/>
  <rect class="mail" x="53" y="14" width="14" height="10" rx="2" fill="#F4B63F"/>
</svg>
