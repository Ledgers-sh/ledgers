<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="ledgers.sh"><style>*{animation-play-state:paused!important;animation-delay:-1.35s!important}</style>
  <title>ledgers.sh</title>
  <desc>A ledger page. The agent's diamond walks down three entry lines as they are written, the total's double rule is drawn, and the diamond turns amber: a person signs.</desc>
  <style>
    /* One 6s cycle: three lines are written, the double rule closes the total, the diamond hands over to a human. */
    .row   { stroke-dasharray: 48; stroke-dashoffset: 48; animation: write 6s ease-out infinite; }
    .r2    { animation-name: write2; }
    .r3    { animation-name: write3; }
    .rule  { stroke-dasharray: 32; stroke-dashoffset: 32; animation: rule 6s ease-out infinite; }
    .agent { transform-box: fill-box; transform-origin: center; animation: walk 6s cubic-bezier(.2,.7,.2,1) infinite; }
    .agent path { animation: hand 6s steps(1,end) infinite; }
    @keyframes write  { 0%,4% { stroke-dashoffset: 48; opacity: 1 } 16%,90% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes write2 { 0%,18% { stroke-dashoffset: 48; opacity: 1 } 30%,90% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes write3 { 0%,32% { stroke-dashoffset: 48; opacity: 1 } 44%,90% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes rule   { 0%,48% { stroke-dashoffset: 32; opacity: 1 } 58%,90% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes walk   { 0%,14% { transform: translateY(0) rotate(45deg) } 18%,28% { transform: translateY(16px) rotate(45deg) } 32%,46% { transform: translateY(32px) rotate(45deg) } 52%,92% { transform: translateY(50px) rotate(225deg) } 100% { transform: translateY(0) rotate(405deg) } }
    @keyframes hand   { 0% { fill: none; stroke: #7FA6C9 } 58% { fill: #E9B44C; stroke: #E9B44C } 94% { fill: none; stroke: #7FA6C9 } }
    @media (prefers-reduced-motion: reduce) {
      .row, .rule { animation: none; stroke-dashoffset: 0 }
      .agent, .agent path { animation: none }
    }
  </style>
  <rect x="10" y="10" width="100" height="100" rx="26" fill="#0F1217"/>
  <rect x="10.75" y="10.75" width="98.5" height="98.5" rx="25.25" fill="none" stroke="#34445A" stroke-width="1.5"/>
  <g stroke-linecap="round" fill="none">
    <path class="row"      d="M44 36H92" stroke="#99A2AE" stroke-width="5"/>
    <path class="row r2"   d="M44 52H92" stroke="#99A2AE" stroke-width="5"/>
    <path class="row r3"   d="M44 68H92" stroke="#99A2AE" stroke-width="5"/>
    <path class="rule"     d="M60 82H92" stroke="#E4E7EB" stroke-width="3"/>
    <path class="rule"     d="M60 89H92" stroke="#E4E7EB" stroke-width="3"/>
  </g>
  <g class="agent" style="transform: rotate(45deg)"><path d="M26 30h10v10H26z" fill="none" stroke="#7FA6C9" stroke-width="3" stroke-linejoin="round"/></g>
</svg>
