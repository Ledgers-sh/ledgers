[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  # Boost Software License 1.0: permissive, OSI-approved. Reached via
  # xxhash-rust (redis -> cratefield-runtime-native). Compatible with MIT.
  "BSL-1.0",
]
confidence-threshold = 0.93

# webpki-roots ships Mozilla's CA root data under CDLA-Permissive-2.0 (permissive
# data license). Reached via sqlx's TLS stack under cratefield-testing's harness feature.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
