[package]
name = "ledgers-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
testing = []

[dependencies]
async-trait = { workspace = true }
cratefield-core = { workspace = true }
ledgers-audit = { workspace = true }
ledgers-commands = { workspace = true }
ledgers-db = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
# People sign-in (issue #12): ID-token signature check (ES256, the same curve
# ledgers-approvals uses), PKCE and the HMAC-sealed login-state cookie.
base64 = "0.22"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
url = "2"

[dev-dependencies]
cratefield-testing = { workspace = true, features = ["harness"] }
ledgers-audit = { workspace = true }
ledgers-db = { workspace = true }
pollster = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
