# Cloudflare Workers configuration for Ledgers server

name = "ledgers"
main = "build/worker/shim.mjs"

compatibility_date = "2024-12-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "ledgers"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "d1/migrations"

# R2 Bucket binding for document storage
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "ledgers-documents"

# Rate Limiting binding for agent key throttling
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1"
simple = { limit = 100, period = 60 }

# Environment variables (non-secret, dev environment)
[vars]
ENV = "dev"
DOCUMENTS_MAX_LARGE_BLOB_BYTES = "33554432"

# Secrets are managed separately:
# - Development: set in .dev.vars (not checked in)
# - Staging and production: `wrangler secret put HARNESS_SECRET --env <env>`
#   (docs/deploy.md has the full staging steps)

# Build configuration
[build]
command = "worker-build --release"

# Production environment overrides
[env.production]
vars = { ENV = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "ledgers-prod"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "ledgers-documents-prod"

# Staging: the deployed test environment behind https://api-staging.ledgers.sh.
# Values here are not inherited from the top level, so each one is set again.
# STAGING_D1_ID and STAGING_COMPANY_ID are placeholders to fill before deploy
# (docs/deploy.md, step 2). Migrations are the flat files in d1/migrations,
# generated from the modules' SQLite migrations (tests/d1_migrations.rs).
[env.staging]
name = "ledgers-api-staging"
compatibility_date = "2026-10-01"

[env.staging.vars]
ENV = "staging"
LEDGERS_DEV = "0"
LEDGERS_DOMAIN = "api-staging.ledgers.sh"
LEDGERS_PUBLIC_URL = "https://api-staging.ledgers.sh"
LEDGERS_CORS_ORIGINS = "https://app-staging.ledgers.sh"
# People sign-in (crates/ledgers-server/src/people.rs). The issuer is the per-app
# Cratefield auth instance; the client id is registered there (docs/deploy.md).
# STAGING_AUTH_CLIENT_ID is a placeholder to fill before deploy, like STAGING_D1_ID.
LEDGERS_AUTH_ISSUER = "https://auth-staging.ledgers.sh"
LEDGERS_AUTH_CLIENT_ID = "STAGING_AUTH_CLIENT_ID"
LEDGERS_APP_URL = "https://app-staging.ledgers.sh"
LEDGERS_COMPANY_ID = "STAGING_COMPANY_ID"
# The demo seed route (POST /admin/seed-demo, docs/deploy.md) also needs the
# SEED_TOKEN secret. Staging only: never set this flag in production.
LEDGERS_ALLOW_DEMO_SEED = "1"
# Per-request Server-Timing header with the database counters (docs/deploy.md).
# Staging only: never set this in production.
LEDGERS_SERVER_TIMING = "1"
DOCUMENTS_MAX_LARGE_BLOB_BYTES = "33554432"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ledgers-staging"
database_id = "STAGING_D1_ID"
migrations_dir = "d1/migrations"

[[env.staging.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "ledgers-documents-staging"

# Agent-key rate limit (crates/ledgers-server/src/rate_limiting.rs). Ratelimit
# bindings are not inherited from the top level, so staging declares its own.
# The Worker answers /v1 with 503 when this binding does not resolve.
[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2"
simple = { limit = 100, period = 60 }
