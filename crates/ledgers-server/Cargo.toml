[package]
name = "ledgers-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cratefield-core = { workspace = true }
ledgers-approvals = { workspace = true }
ledgers-auth = { workspace = true }
ledgers-commands = { workspace = true }
ledgers-ext = { workspace = true }
ledgers-ledger = { workspace = true }

# getrandom versions need wasm_js feature on wasm32-unknown-unknown.
# 0.4 from cratefield-core; 0.2 from p256 (via ledgers-approvals).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", default-features = false, features = ["js"] }

[lints]
workspace = true
