[package]
name = "ledgers-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ledgers-server"
path = "src/main.rs"
required-features = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cratefield-core = { workspace = true }
ledgers-approvals = { workspace = true }
ledgers-auth = { workspace = true }
ledgers-commands = { workspace = true }
ledgers-demo = { workspace = true }
ledgers-ext = { workspace = true }
ledgers-ledger = { workspace = true }
ledgers-money = { workspace = true }
ledgers-storage = { workspace = true }
ledgers-db = { workspace = true }
ledgers-documents = { workspace = true }
ledgers-bank = { workspace = true }
ledgers-bills = { workspace = true }
ledgers-extract = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
ledgers-policy = { workspace = true }
ledgers-fx = { workspace = true }
ledgers-tax = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
bytes = { workspace = true }
schemars = { workspace = true }
sea-query = { workspace = true }
time = { workspace = true }
ledgers-audit = { workspace = true }
# Organizations and memberships (the company is one organization); the invitation
# mail goes through the Mailer port (Owlpost on Workers and native).
cratefield-module-orgs = { workspace = true }
cratefield-adapter-owlpost = { workspace = true }
# People sign-in (issue #12): HTTP requests to the issuer and the form body of
# the token exchange.
http = "1"
url = "2"

# Entropy for API-key ids and secrets (the harness `RandomBytes` port is ours to supply).
getrandom = { version = "0.4.3" }

# Native runtime: tokio, SQLite, and tracing
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cratefield-runtime-native = { workspace = true }
cratefield-adapter-sqlite = { workspace = true }
tokio = { version = "1", features = ["full"] }

# Cloudflare Worker runtime
# getrandom versions need wasm_js feature on wasm32-unknown-unknown.
# 0.4 from cratefield-core; 0.2 from p256 (via ledgers-approvals).
[target.'cfg(target_arch = "wasm32")'.dependencies]
cratefield-runtime-cloudflare = { workspace = true }
worker = { version = "0.8.5", features = ["d1"], default-features = false }
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", default-features = false, features = ["js"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
rusqlite = "0.40"
cratefield-testing = { workspace = true, features = ["harness"] }
pollster = { workspace = true }
serde_json = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
tower = "0.5"

[lints]
workspace = true
