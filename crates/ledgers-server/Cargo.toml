[package]
name = "ledgers-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cratefield-core = { workspace = true }

# getrandom 0.4 (via cratefield-core -> ulid -> rand) needs the wasm_js feature on
# wasm32-unknown-unknown; the runtime crates provide it once the real server
# composition lands, until then enable it here, wasm-only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }

[lints]
workspace = true
