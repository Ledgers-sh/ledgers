[package]
name = "ledgers-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The Postgres leg of the connections migration (CI and a local postgres:16).
postgres = ["cratefield-testing/postgres"]

[dependencies]
cratefield-core = { workspace = true }
ledgers-bills = { workspace = true }
ledgers-commands = { workspace = true }
ledgers-db = { workspace = true }
ledgers-ledger = { workspace = true }
ledgers-money = { workspace = true }
ledgers-documents = { workspace = true }
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
ring = { version = "0.17.14", default-features = true, features = ["wasm32_unknown_unknown_js"] }
bytes = { workspace = true }
http = "1"
aes-gcm = "0.10"
getrandom = "0.4"

[dev-dependencies]
pollster = { workspace = true }
cratefield-testing = { workspace = true, features = ["harness"] }
ledgers-audit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
