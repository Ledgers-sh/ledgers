[package]
name = "ledgers-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Core, the port-conformance surface of the testing kit (no harness graph by default).
cratefield-core = { workspace = true }
cratefield-testing = { workspace = true }

# Money types and validation.
ledgers-money = { workspace = true }

# Database port, guard patterns, and daily limit consumption.
ledgers-db = { workspace = true }

# Command registry, tier, principal, decision, and policy traits.
ledgers-commands = { workspace = true }

# Serialization and JSON schema generation.
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# Time: exact version matching cratefield-core, with serde RFC3339 support.
time = { workspace = true, features = ["serde-well-known"] }

[dev-dependencies]
# The harness for testing (concurrency tests).
cratefield-testing = { workspace = true, features = ["harness"] }

# For blocking tests.
pollster = { workspace = true, features = ["macro"] }

# SHA-256 for document hashing in tests.
sha2 = { workspace = true }

# Futures utilities for stream handling in mock.
futures-util = { workspace = true }

[lints]
workspace = true
