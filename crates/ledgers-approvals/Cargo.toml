[package]
name = "ledgers-approvals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
postgres = ["cratefield-testing/postgres"]

[dependencies]
cratefield-core = { workspace = true }
ledgers-db = { workspace = true }
ledgers-audit = { workspace = true }
ledgers-commands = { workspace = true }
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa"] }
signature = "2.2"
base64 = "0.22"
hex = "0.4"
time = { workspace = true }

[dev-dependencies]
cratefield-testing = { workspace = true, features = ["harness"] }
ledgers-db = { workspace = true }
ledgers-money = { workspace = true }
ledgers-storage = { path = "../ledgers-storage" }
pollster = { workspace = true, features = ["macro"] }
schemars = { workspace = true }
p256 = { version = "0.13", features = ["arithmetic", "ecdsa"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
async-trait = { workspace = true }

[lints]
workspace = true
