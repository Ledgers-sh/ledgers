[package]
name = "ledgers-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[[bin]]
name = "ledgers"
path = "src/main.rs"

[dependencies]
# Ledgers workspace crates
ledgers-commands = { workspace = true }
ledgers-server = { path = "../ledgers-server" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Native runtime for `ledgers serve` (the same crates ledgers-server's binary uses)
cratefield-core = { workspace = true }
cratefield-runtime-native = { workspace = true }
cratefield-adapter-sqlite = { workspace = true }

# CLI: clap builder API
clap = { version = "4", features = ["derive", "cargo"] }
clap_complete = { version = "4" }

# HTTP client: reqwest with rustls
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# OS keychain for profile keys (MIT/Apache-2.0; already in the lockfile, allowed by deny.toml)
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# Config files
toml = { workspace = true }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
insta = { workspace = true }
tempfile = "3"
mockito = "1"

[lints]
workspace = true
