[package]
name = "ledgers-bank"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The Postgres parity leg of the bank store matrix (CI and a local postgres:16).
postgres = ["cratefield-testing/postgres"]

[dependencies]
cratefield-core = { workspace = true }
cratefield-text-guard = { workspace = true }
ledgers-bills = { workspace = true }
ledgers-commands = { workspace = true }
ledgers-db = { workspace = true }
ledgers-documents = { workspace = true }
ledgers-extract = { workspace = true }
ledgers-ledger = { workspace = true }
ledgers-money = { workspace = true }
ledgers-subledger = { workspace = true }
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
proptest = { workspace = true }
cratefield-testing = { workspace = true, features = ["harness"] }
ledgers-storage = { workspace = true }

[lints]
workspace = true
