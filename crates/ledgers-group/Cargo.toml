[package]
name = "ledgers-group"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The Postgres leg of the group migrations and store (CI and a local postgres:16).
postgres = ["cratefield-testing/postgres"]

[dependencies]
cratefield-core = { workspace = true }
ledgers-commands = { workspace = true }
ledgers-db = { workspace = true }
ledgers-ledger = { workspace = true }
ledgers-money = { workspace = true }
ledgers-tax = { workspace = true }
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }

[dev-dependencies]
ledgers-audit = { workspace = true }
ledgers-db = { workspace = true }
ledgers-storage = { workspace = true }
pollster = { workspace = true }
cratefield-testing = { workspace = true, features = ["harness"] }

[lints]
workspace = true
