[package]
name = "ledgers-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The Postgres parity leg of the conformance matrix: native-only, opted into
# by CI and a local postgres:16 (FZ_TEST_POSTGRES_URL). The lib itself stays
# wasm-clean without it.
postgres = ["cratefield-testing/postgres"]

[dependencies]
# The lib is wasm32-clean: core, the light port-conformance surface of the
# testing kit (the workspace default — no harness graph) and sea-query only.
cratefield-core = { workspace = true }
cratefield-testing = { workspace = true }
sea-query = { workspace = true }

[dev-dependencies]
# The harness (TestHarness over in-memory SQLite) for the conformance
# matrix — the kit's default feature set; the lib never sees it.
cratefield-testing = { workspace = true, features = ["harness"] }
pollster = { workspace = true, features = ["macro"] }

[lints]
workspace = true
