[package]
name = "ledgers-ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The Postgres parity leg of the scenario matrix: native-only, opted into
# by CI and a local postgres:16 (FZ_TEST_POSTGRES_URL). The lib itself
# stays wasm-clean without it.
postgres = ["cratefield-testing/postgres"]
testing = []

[dependencies]
# The lib is wasm32-clean: core, the light port-conformance surface of the
# testing kit (the workspace default — no harness graph), sea-query for
# statements, the workspace money crate for currency validation, and
# serde/toml for the bundled chart templates. The journal work adds the
# guard-statement helpers (ledgers-db: periods, chain, retry) and the
# hash-chained audit log (ledgers-audit: events, canonical JSON, the
# offline verifier), plus serde_json for the problem+json extension
# members and the JSON columns — all wasm-clean; core does not re-export
# serde_json.
cratefield-core = { workspace = true }
cratefield-testing = { workspace = true }
ledgers-commands = { workspace = true }
ledgers-db = { workspace = true }
ledgers-audit = { workspace = true }
sea-query = { workspace = true }
ledgers-money = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# The harness (TestHarness over in-memory SQLite) for the scenario
# matrix — the kit's default feature set; the lib never sees it — plus
# the guard foundation's knobs the scenarios turn directly (period
# status, the retry policy, the genesis hash).
cratefield-testing = { workspace = true, features = ["harness"] }
ledgers-db = { workspace = true }
ledgers-storage = { workspace = true }
# The trend tests post receivables and payables as real subledger items.
ledgers-subledger = { workspace = true }
pollster = { workspace = true, features = ["macro"] }
# Golden snapshot testing for the command registry surface.
insta = { workspace = true }
# Compile-fail UI tests for ExecToken.
trybuild = { workspace = true }

[lints]
workspace = true
